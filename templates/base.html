<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BECS{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header class="main-header">
        <div class="header-container">

            <div class="logo">
                <h1>BECS</h1>
                <span>Blood Bank Management System</span>
            </div>

            <nav class="navbar">
                <a href="/">Dashboard</a>
                <a href="/donation">Blood Donation</a>
                <a href="/routine-issue">Routine Issue</a>
                <a href="/emergency">Emergency MCI</a>
                <a href="/audit-trail">Audit Trail</a>
            </nav>

        </div>
    </header>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
